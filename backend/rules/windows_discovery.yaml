id: DET-SYSTEMINFO-001
name: Windows System Information Discovery
description: Detects systeminfo.exe process creation.
enabled: true
platforms: [windows]
event_types: [process_creation]
conditions: {process: {equals: systeminfo.exe}}
severity: LOW
mitre: {technique: T1082, tactic: Discovery}
explanation: Sysmon recorded the built-in systeminfo utility.
